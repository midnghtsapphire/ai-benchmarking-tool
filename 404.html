<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Benchmarking Tool</title>
  <script>
    // GitHub Pages SPA redirect
    // Converts path-based URLs to hash-based for SPA routing
    var path = window.location.pathname;
    var repo = '/ai-benchmarking-tool';
    if (path.startsWith(repo)) {
      path = path.slice(repo.length);
    }
    if (path && path !== '/') {
      window.location.replace(
        window.location.origin + repo + '/#' + path + window.location.search
      );
    } else {
      window.location.replace(window.location.origin + repo + '/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
